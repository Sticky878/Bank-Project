<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FMC Bank - Forgot Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">FMC Bank<span>.</span></a>
      <h2>Forgot Password?</h2>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <form id="forgotForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="forgotEmail" placeholder="Email Address" required />
        </div>
        <button type="submit" class="auth-btn">Send Reset Link</button>
      </form>

      <p class="auth-footer">
        Remembered it? <a href="login.html">Back to Login</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        alert(data.message || 'If that email exists, a reset link has been sent.');
        if (res.ok) window.location.href = 'login.html';
      } catch (err) {
        alert('Server error. Is the backend running?');
      }
    });
  </script>
</body>
</html>
