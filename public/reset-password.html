<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FMC Bank - Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">FMC Bank<span>.</span></a>
      <h2>Reset Your Password</h2>
      <p class="auth-subtitle">Choose a strong new password.</p>

      <form id="resetForm">
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="newPassword" placeholder="New Password" required />
          <span class="toggle-password" onclick="togglePassword('newPassword', this)">
            <i class="fas fa-eye"></i>
          </span>
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="confirmNewPassword" placeholder="Confirm New Password" required />
        </div>
        <button type="submit" class="auth-btn">Update Password</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Back to Login</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword(inputId, iconEl) {
      const input = document.getElementById(inputId);
      const icon = iconEl.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Extract token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      alert('Invalid reset link.');
      window.location.href = 'login.html';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword !== confirmNewPassword) {
        alert('Passwords do not match.');
        return;
      }
      if (newPassword.length < 8) {
        alert('Password must be at least 8 characters.');
        return;
      }

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          alert('✅ ' + data.message);
          window.location.href = 'login.html';
        } else {
          alert('❌ ' + data.error);
        }
      } catch (err) {
        alert('Server error. Please try again.');
      }
    });
  </script>
</body>
</html>
